<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>多线叙事时间线 — Dramatica-Flow</title>
<style>
:root {
  --bg-dark:#0d1117; --bg:#161b22; --bg2:#1c2333; --bg3:#21293a;
  --surface:#1c2333; --surface2:#242d3f; --surface3:#2a3447;
  --border:#30363d; --border2:#444c56; --border3:#58647a;
  --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
  --blue:#58a6ff; --blue-bg:rgba(88,166,255,.12); --blue-dim:rgba(88,166,255,.06);
  --purple:#bc8cff; --purple-bg:rgba(188,140,255,.12);
  --cyan:#39d2c0; --cyan-bg:rgba(57,210,192,.12);
  --orange:#f0883e; --orange-bg:rgba(240,136,62,.12);
  --green:#3fb950; --green-bg:rgba(63,185,80,.12);
  --red:#f85149; --red-bg:rgba(248,81,73,.12);
  --yellow:#d29922; --yellow-bg:rgba(210,153,34,.12);
  --pink:#ff7eb3; --pink-bg:rgba(255,126,179,.12);
  --radius:6px; --radius-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;color:var(--text);background:var(--bg-dark);line-height:1.5;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── 顶栏 ── */
.topbar{height:46px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:10}
.brand{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px}.brand em{color:var(--blue);font-style:normal}
.sep{width:1px;height:20px;background:var(--border)}
.topbar-sub{font-size:12px;color:var(--text3)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.bk-select{padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;min-width:160px;cursor:pointer;outline:none}
.bk-select:focus{border-color:var(--blue)}
.btn{font-size:12px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .12s}
.btn:hover{background:var(--surface2);border-color:var(--border2)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#000;font-weight:600}
.btn-primary:hover{opacity:.88}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-block{width:100%;justify-content:center}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--surface);color:var(--text)}

/* ── 主体 ── */
.body{flex:1;display:flex;overflow:hidden}

/* ── 左侧线程列表 ── */
.sidebar{width:240px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-hd{padding:12px 14px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.badge-count{font-size:10px;background:var(--surface2);color:var(--text2);padding:1px 7px;border-radius:10px;font-weight:500}
.thread-list{flex:1;overflow-y:auto;padding:8px}
.thread-item{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:5px;cursor:pointer;transition:all .12s;position:relative}
.thread-item:hover{border-color:var(--border2);background:var(--surface)}
.thread-item.active{border-color:var(--blue);background:var(--blue-dim)}
.thread-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--blue);border-radius:0 2px 2px 0}
.ti-name{font-size:12px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ti-meta{font-size:11px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thread-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.type-badge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.tb-main{background:var(--blue-bg);color:var(--blue)}
.tb-subplot{background:var(--purple-bg);color:var(--purple)}
.tb-parallel{background:var(--cyan-bg);color:var(--cyan)}
.tb-flashback{background:var(--orange-bg);color:var(--orange)}
.tb-active{background:var(--green-bg);color:var(--green)}
.tb-dormant{background:var(--yellow-bg);color:var(--yellow)}
.tb-resolved{background:var(--surface2);color:var(--text3)}
.sidebar-ft{padding:10px;border-top:1px solid var(--border)}

/* ── 中央泳道 ── */
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.center-hd{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg)}
.center-title{font-size:13px;font-weight:600;white-space:nowrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 10px;border-radius:10px;cursor:pointer;border:1px solid var(--border);color:var(--text3);transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--border2);color:var(--text2)}
.chip.on{background:var(--blue-bg);color:var(--blue);border-color:rgba(88,166,255,.3)}
.center-hd-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.zoom-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.zoom-input{width:46px;padding:3px 4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:11px;text-align:center}
.zoom-tag{font-size:10px;color:var(--text3);opacity:.85}
.zoom-wrap .btn-sm{padding:2px 6px;font-size:12px;line-height:1}

/* ── 泳道图区域 ── */
.swimlane-outer{flex:1;overflow:auto;padding:0 0 14px 16px}
.swimlane-inner{min-width:900px}

/* ── 章节范围控件 ── */
.range-bar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg);flex-wrap:wrap}
.range-bar label{font-size:11px;color:var(--text3);white-space:nowrap}
.range-inputs{display:flex;align-items:center;gap:6px}
.range-inputs input{width:56px;padding:3px 6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:11px;text-align:center}
.range-inputs input:focus{border-color:var(--blue)}
.range-inputs span{color:var(--text3);font-size:11px}
.range-btn{font-size:10px;padding:2px 8px}

/* ── 迷你总览热力条 ── */
.minimap-wrap{padding:6px 14px 0;background:var(--bg);flex-shrink:0}
.minimap-outer{position:relative;height:28px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;overflow:hidden}
.minimap-dot{position:absolute;top:50%;width:2px;height:14px;border-radius:1px;transform:translateY(-50%);pointer-events:none;opacity:.8}
.minimap-dot.key-dot{width:3px;height:18px;opacity:1}
.minimap-viewport{position:absolute;top:0;bottom:0;border:1.5px solid var(--blue);background:rgba(88,166,255,.08);border-radius:2px;pointer-events:none;transition:left .15s,width .15s}
.minimap-now{position:absolute;top:0;bottom:0;width:1px;background:var(--green);opacity:.5;pointer-events:none}

/* ── 章节标尺 ── */
.ruler-row{display:flex;margin-bottom:6px}
.ruler-label-cell{width:160px;flex-shrink:0}
.ruler-track{flex:1;position:relative;height:20px;overflow:hidden}
.ruler-mark{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--text3);white-space:nowrap;user-select:none}
.ruler-mark::before{content:'';position:absolute;left:50%;top:-4px;width:1px;height:4px;background:var(--border2)}

/* ── 幕分区背景 ── */
.act-bg{position:absolute;top:0;bottom:0;border-right:1px dashed var(--border);pointer-events:none}
.act-label{position:absolute;font-size:9px;color:var(--text3);top:2px;transform:translateX(-50%);user-select:none;background:var(--bg-dark);padding:0 4px;border-radius:3px}

/* ── 泳道行 ── */
.lane-row{display:flex;align-items:center;margin-bottom:6px;min-height:38px}
.lane-label{width:160px;flex-shrink:0;font-size:12px;font-weight:600;padding-right:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.lane-track{flex:1;position:relative;height:34px;background:var(--surface);border-radius:4px;border:1px solid var(--border);overflow:visible}
/* 动态高度：同章事件多时自动增高 */
.lane-track.highlight{border-color:var(--blue);background:var(--blue-dim)}
.lane-now{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--green);opacity:.5;pointer-events:none;z-index:1}
.lane-now::after{content:'▼';position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:6px;color:var(--green)}

/* ── 事件方块 ── */
.ev{position:absolute;top:3px;height:28px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 7px;font-size:10px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2;transition:transform .1s,box-shadow .1s;min-width:8px}
.ev:hover{transform:scaleY(1.18);box-shadow:0 3px 10px rgba(0,0,0,.5);z-index:20}
.ev.sel{outline:2px solid #fff;outline-offset:1px;z-index:30}
.ev-pos{background:#1a6fd4}
.ev-emotion{background:#b83c3c}
.ev-info{background:#1a7a32}
.ev-conflict{background:#c06010}
.ev-other{background:#5a3aa0}
.ev-key{background:linear-gradient(135deg,#c06010,#b83c3c)}
.ev.dimmed{opacity:.3 !important;height:10px !important;top:6px !important;font-size:0 !important;width:6px !important;min-width:6px}

/* ── 事件颜色 tooltip ── */
.ev-legend{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);flex-wrap:wrap}
.ev-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.legend-hint{margin-left:auto;font-size:10px;color:var(--text3);opacity:.75;white-space:nowrap}
.ev-legend-dot{width:10px;height:10px;border-radius:3px}

/* ── 右侧详情 ── */
.detail{width:280px;background:var(--bg);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.detail-hd{padding:12px 14px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.detail-body{flex:1;overflow-y:auto;padding:14px}
.detail-empty{color:var(--text3);font-size:12px;text-align:center;padding:40px 16px;line-height:1.8}
.df{margin-bottom:12px}
.df-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.df-val{font-size:12px;color:var(--text);line-height:1.5}
.df-val.colored{font-weight:600}
.detail-ft{padding:10px 14px;border-top:1px solid var(--border)}

/* ── 底部面板 ── */
.bottom{height:180px;border-top:1px solid var(--border);display:flex;flex-shrink:0;background:var(--bg)}
.bottom-tabs{width:110px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.btab{padding:9px 10px;font-size:11px;color:var(--text3);cursor:pointer;border-bottom:1px solid var(--border);transition:all .12s;display:flex;align-items:center;gap:6px;line-height:1.3}
.btab:hover{color:var(--text2);background:var(--surface)}
.btab.on{background:var(--surface);color:var(--blue);border-left:2px solid var(--blue)}
.btab-badge{font-size:10px;background:var(--yellow-bg);color:var(--yellow);padding:1px 5px;border-radius:8px;font-weight:600;margin-left:auto}
.bottom-body{flex:1;overflow-y:auto;padding:10px 14px}
.causal-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.causal-row:last-child{border-bottom:none}
.causal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.warn-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--yellow-bg);border:1px solid rgba(210,153,34,.3);border-radius:var(--radius);margin-bottom:5px;font-size:11px}
.warn-badge{background:var(--yellow);color:#000;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;flex-shrink:0}

/* ── 空态 ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;text-align:center;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:14px;opacity:.4}
.empty-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-desc{font-size:12px;max-width:320px;line-height:1.7}

/* ── 模态框 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg);border:1px solid var(--border2);border-radius:12px;width:500px;max-height:82vh;overflow-y:auto}
.modal-hd{padding:16px 20px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:18px 20px}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.fg{margin-bottom:13px}
.flabel{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:4px}
.finput,.fselect,.ftextarea{width:100%;padding:7px 11px;background:var(--bg-dark);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-family:inherit;outline:none}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--blue)}
.ftextarea{min-height:56px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fhint{font-size:10px;color:var(--text3);margin-top:3px}

/* ── 滚动条 ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* ── 加载 ── */
.loader{display:flex;align-items:center;gap:10px;padding:40px;color:var(--text3);font-size:12px}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 提示 tooltip ── */
.tooltip-wrap{position:relative}

/* ═══════════════════════════════════════════════════════
   UI 增强层（后写覆盖，保持原有结构不变）
   ═══════════════════════════════════════════════════════ */
body{background:radial-gradient(1400px 700px at 18% -12%,#131b27 0%,var(--bg-dark) 58%)}
.topbar{background:rgba(22,27,34,.94);backdrop-filter:blur(10px)}
.topbar-sub{color:var(--text2)}

/* 书籍概览胶囊 */
.meta-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border:1px solid var(--border);border-radius:13px;background:var(--surface);font-size:11px;color:var(--text2);white-space:nowrap;max-width:340px;overflow:hidden}
.meta-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px rgba(63,185,80,.7)}
.meta-chip b{color:var(--text);font-weight:600}
.meta-chip .msep{color:var(--border3)}

/* 左侧线程卡片 */
.thread-item{padding:9px 11px}
.thread-item.active{box-shadow:inset 0 0 0 1px rgba(88,166,255,.4),0 2px 10px rgba(0,0,0,.25)}
.ti-name{align-items:center}
.ti-bar{height:3px;border-radius:2px;background:var(--surface3);margin-top:7px;overflow:hidden}
.ti-bar>i{display:block;height:100%;border-radius:2px;transition:width .2s}
.ti-range{font-variant-numeric:tabular-nums}

/* 筛选计数 */
.chip .chip-n{margin-left:5px;opacity:.65;font-variant-numeric:tabular-nums;font-size:10px}
.chip.on .chip-n{opacity:.85}
.center-hd{background:linear-gradient(180deg,var(--bg),rgba(22,27,34,.55))}

/* 泳道滚动区 */
.swimlane-outer{padding:0 0 22px 0;cursor:grab}
.swimlane-outer.panning{cursor:grabbing;user-select:none}
.swimlane-outer.panning .ev,.swimlane-outer.panning .lane-label{cursor:grabbing}
.swimlane-outer .ev,.swimlane-outer .lane-label{cursor:pointer}
.swimlane-inner{padding:8px 16px 0 0;min-width:0}
.ruler-row{position:sticky;top:0;z-index:14;background:linear-gradient(180deg,var(--bg-dark) 72%,rgba(13,17,23,0));padding:6px 0 8px;margin-bottom:2px}
.ruler-track{height:42px!important}
.act-label{top:2px}
.ruler-mark{top:24px}
.ruler-mark::before{top:-6px;height:5px}
.ruler-label-cell{position:sticky;left:0;z-index:15;width:176px;background:var(--bg-dark)}
.lane-row{position:relative;margin-bottom:8px;padding:2px 0;border-radius:var(--radius-lg);transition:background .12s}
.lane-row:hover{background:rgba(255,255,255,.016)}
.lane-label{position:sticky;left:0;z-index:50;width:176px;padding:0 14px 0 0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;background:var(--bg-dark);line-height:1.3!important;text-align:right;cursor:pointer;align-self:stretch}
.lane-label .ll-name{font-size:12px;font-weight:600;max-width:158px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-label .ll-meta{font-size:9px;color:var(--text3);display:flex;gap:6px;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums}
.lane-label:hover .ll-name{text-decoration:underline}
.lane-track{background:linear-gradient(180deg,rgba(28,35,51,.95),rgba(28,35,51,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.lane-track.highlight{box-shadow:inset 0 0 0 1px rgba(88,166,255,.5),0 0 0 1px rgba(88,166,255,.14)}

/* 事件块 */
.ev{border-radius:5px;padding:0 6px;box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .12s,box-shadow .12s,filter .12s}
.ev:hover{transform:translateY(-1px) scaleY(1.12);box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.28);filter:saturate(1.12)}
.ev-key{box-shadow:0 0 0 1px rgba(240,136,62,.55),0 0 10px rgba(240,136,62,.22),inset 0 0 0 1px rgba(255,255,255,.12)}
.ev.sel{outline:2px solid #fff;outline-offset:1px;box-shadow:0 0 0 3px rgba(88,166,255,.35)}
.ev.dimmed{opacity:.2!important;height:8px!important;top:8px!important;font-size:0!important;width:5px!important;min-width:5px!important;padding:0!important}

/* 当前章标线 */
.lane-now{width:2px;background:linear-gradient(180deg,transparent,var(--green),transparent);opacity:.75}

/* 迷你总览 */
.minimap-outer{height:30px;background:linear-gradient(180deg,var(--surface2),var(--surface));border-radius:6px}
.minimap-viewport{border-width:2px;transition:none}

/* 右侧详情 */
.detail{width:300px;background:linear-gradient(180deg,var(--bg),#141a24)}
.detail-hd{position:sticky;top:0;z-index:3;background:rgba(22,27,34,.96);backdrop-filter:blur(6px)}
.dt-card{border:1px solid var(--border);border-radius:8px;padding:11px 12px;margin-bottom:10px;background:var(--surface)}
.dt-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.dt-kv{display:flex;gap:8px;font-size:11px;padding:3px 0;color:var(--text3)}
.dt-kv b{color:var(--text);font-weight:500}
.dt-chain{font-size:11px;line-height:1.7;padding:8px 10px;border-left:2px solid var(--blue);background:rgba(88,166,255,.05);border-radius:0 6px 6px 0;margin-top:6px}

/* 底部面板 */
.causal-row{padding:7px 9px;border-radius:6px;border-bottom:none;margin-bottom:4px;background:var(--surface);flex-wrap:wrap;gap:6px}
.causal-row:hover{background:var(--surface2)}
.causal-ch{font-size:10px;padding:1px 7px;border-radius:8px;background:var(--surface3);color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.warn-row{background:rgba(210,153,34,.08);border-color:rgba(210,153,34,.25)}

/* 空态 / 加载骨架 */
.empty-icon{font-size:44px;opacity:.35}
.loader{padding:52px 40px}
.skeleton{height:34px;border-radius:6px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 37%,var(--surface) 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;margin-bottom:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="brand"><em>Dramatica</em>-Flow</div>
  <div class="sep"></div>
  <div class="topbar-sub">多线叙事时间线</div>
  <div class="topbar-right">
    <span class="meta-chip" id="book-meta" title="当前书籍概览"><span class="dot"></span><span>未加载</span></span>
    <select class="bk-select" id="bk-sel" onchange="loadBook(this.value)">
      <option value="">-- 选择书籍 --</option>
      <option value="demo">吞天魔帝（演示）</option>
    </select>
    <select class="bk-select" id="ch-sel" style="min-width:100px">
      <option value="">提取章节</option>
    </select>
    <button class="btn btn-primary" onclick="extractData(this)" title="从章节正文提取时间线数据（需后端）">⚡ 提取</button>
  </div>
</div>

<!-- 主体 -->
<div class="body">

  <!-- 左侧：线程列表 -->
  <div class="sidebar">
    <div class="sidebar-hd">
      叙事线程
      <span class="badge-count" id="thread-count">0</span>
    </div>
    <div class="thread-list" id="thread-list">
      <div class="detail-empty" style="padding:24px 16px">选择书籍后显示</div>
    </div>
    <div class="sidebar-ft">
      <button class="btn btn-primary btn-block" onclick="showAddThread()">＋ 添加线程</button>
    </div>
  </div>

  <!-- 中央 -->
  <div class="center">
    <div class="center-hd">
      <div class="center-title">泳道时间线</div>
      <div class="chips" id="filter-chips">
        <div class="chip on" data-f="all" onclick="setFilter('all',this)">全部</div>
        <div class="chip" data-f="position" onclick="setFilter('position',this)">位置</div>
        <div class="chip" data-f="emotion" onclick="setFilter('emotion',this)">情感</div>
        <div class="chip" data-f="info" onclick="setFilter('info',this)">信息</div>
        <div class="chip" data-f="conflict" onclick="setFilter('conflict',this)">冲突</div>
        <div class="chip" data-f="key" onclick="setFilter('key',this)">关键节点</div>
      </div>
      <div class="center-hd-right">
        <div class="zoom-wrap" title="横向缩放控制章节宽度；纵向缩放控制泳道高度。也可用 Ctrl+滚轮整体缩放、Alt+滚轮仅纵向缩放">
          <span class="zoom-tag">横</span>
          <input class="zoom-input" id="zoom-input" type="number" value="100" min="40" max="300" step="10" onchange="setZoom(this.value)">
          <span class="zoom-tag">纵</span>
          <input class="zoom-input" id="zoomy-input" type="number" value="100" min="50" max="220" step="10" onchange="setZoomY(this.value)">
          <button class="btn btn-ghost btn-sm" onclick="fitToWindow()" title="让整本书的时间线铺满窗口宽度">适应</button>
          <button class="btn btn-ghost btn-sm" onclick="resetZoom()" title="缩放恢复 100% 并回到起点">&#8635;</button>
        </div>
      </div>
    </div>

    <!-- 图例 -->
    <div class="ev-legend">
      <div class="ev-legend-item"><div class="ev-legend-dot" style="background:#1a6fd4"></div>位置变化</div>
      <div class="ev-legend-item"><div class="ev-legend-dot" style="background:#b83c3c"></div>情感转变</div>
      <div class="ev-legend-item"><div class="ev-legend-dot" style="background:#1a7a32"></div>信息揭示</div>
      <div class="ev-legend-item"><div class="ev-legend-dot" style="background:#c06010"></div>核心冲突</div>
      <div class="ev-legend-item"><div class="ev-legend-dot" style="background:linear-gradient(135deg,#c06010,#b83c3c)"></div>关键节点</div>
      <div class="ev-legend-item"><div class="ev-legend-dot" style="background:#5a3aa0"></div>其他</div>
      <span class="legend-hint">Ctrl+滚轮缩放 · 按住左键拖动平移 · 滚轮正常滚动</span>
    </div>

    <!-- 章节范围 + 迷你总览 -->
    <div class="range-bar" id="range-bar" style="display:none">
      <label>章节范围</label>
      <div class="range-inputs">
        <input type="number" id="range-from" min="1" value="1" onchange="setRange()">
        <span>~</span>
        <input type="number" id="range-to" min="1" value="90" onchange="setRange()">
      </div>
      <button class="btn range-btn" onclick="setRangeAll()">全部</button>
      <button class="btn range-btn" onclick="setRangeAround()">当前 ±30</button>
      <span id="range-info" style="font-size:10px;color:var(--text3);margin-left:auto"></span>
    </div>
    <div class="minimap-wrap" id="minimap-wrap" style="display:none">
      <div class="minimap-outer" id="minimap" onmousedown="minimapDrag(event)" onmousemove="minimapDrag(event)">
        <div class="minimap-viewport" id="minimap-vp"></div>
        <div class="minimap-now" id="minimap-now"></div>
      </div>
    </div>

    <!-- 泳道图 -->
    <div class="swimlane-outer" id="swimlane-outer">
      <div class="empty" id="empty-state">
        <div class="empty-icon">〰</div>
        <div class="empty-title">选择书籍开始</div>
        <div class="empty-desc">从右上角下拉菜单选择书籍，即可查看多线叙事泳道图。点击左侧线程名可高亮该线，点击事件方块查看详情。</div>
      </div>
    </div>
  </div>

  <!-- 右侧详情 -->
  <div class="detail">
    <div class="detail-hd">
      事件详情
      <button class="btn btn-ghost btn-sm" id="detail-close-btn" onclick="closeDetail()" style="display:none">✕</button>
    </div>
    <div class="detail-body" id="detail-body">
      <div class="detail-empty">点击泳道中的<br>事件方块查看详情</div>
    </div>
    <div class="detail-ft" id="detail-ft" style="display:none">
      <button class="btn btn-sm btn-block" onclick="closeDetail()">关闭</button>
    </div>
  </div>

</div>

<!-- 底部：因果链 + 掉线预警 -->
<div class="bottom">
  <div class="bottom-tabs">
    <div class="btab on" id="btab-causal" onclick="switchTab('causal')">
      跨线因果
      <span class="btab-badge" id="causal-badge" style="display:none"></span>
    </div>
    <div class="btab" id="btab-warning" onclick="switchTab('warning')">
      掉线预警
      <span class="btab-badge" id="warning-badge" style="display:none"></span>
    </div>
  </div>
  <div class="bottom-body" id="bottom-body">
    <div class="detail-empty" style="padding:20px">选择书籍后加载</div>
  </div>
</div>

<!-- 添加线程模态框 -->
<div class="modal-overlay" id="thread-modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hd">
      <span id="modal-title">添加叙事线程</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="frow">
        <div class="fg">
          <label class="flabel">线程 ID *</label>
          <input class="finput" id="tf-id" placeholder="thread_subplot_a">
          <div class="fhint">英文，唯一标识符</div>
        </div>
        <div class="fg">
          <label class="flabel">名称 *</label>
          <input class="finput" id="tf-name" placeholder="慕雪线">
        </div>
      </div>
      <div class="frow">
        <div class="fg">
          <label class="flabel">类型</label>
          <select class="fselect" id="tf-type">
            <option value="main">主线 main</option>
            <option value="subplot" selected>支线 subplot</option>
            <option value="parallel">并行 parallel</option>
            <option value="flashback">闪回 flashback</option>
          </select>
        </div>
        <div class="fg">
          <label class="flabel">权重 (0.1–1.0)</label>
          <input class="finput" id="tf-weight" type="number" step="0.1" min="0.1" max="1.0" value="0.7">
          <div class="fhint">影响章节字数分配</div>
        </div>
      </div>
      <div class="frow">
        <div class="fg">
          <label class="flabel">视角角色 ID</label>
          <input class="finput" id="tf-pov" placeholder="mu_xue">
        </div>
        <div class="fg">
          <label class="flabel">参与角色（逗号分隔）</label>
          <input class="finput" id="tf-chars" placeholder="lin_chen, mu_xue">
        </div>
      </div>
      <div class="fg">
        <label class="flabel">叙事目标</label>
        <textarea class="ftextarea" id="tf-goal" placeholder="这条线程要解决什么核心问题？"></textarea>
      </div>
      <div class="fg">
        <label class="flabel">成长弧线</label>
        <input class="finput" id="tf-arc" placeholder="从……到……">
      </div>
      <div class="frow">
        <div class="fg">
          <label class="flabel">起始章节</label>
          <input class="finput" id="tf-start" type="number" min="1" value="1">
        </div>
        <div class="fg">
          <label class="flabel">合并章节（可选）</label>
          <input class="finput" id="tf-merge" type="number" min="1" placeholder="留空表示不限">
        </div>
      </div>
      <div class="fg">
        <label class="flabel">结尾钩子</label>
        <input class="finput" id="tf-hook" placeholder="线程结束时的悬念">
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveThread()">创建线程</button>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════════════════
// 全局状态
// ═══════════════════════════════════════════════════════
let state = {
  bookId: '',
  bookTitle: '',
  demo: false,
  threads: [],
  timeline: [],
  timelineFull: [],   // 完整时间线（不受范围过滤）
  causal: [],
  dormant: [],
  threadChapterMap: {},  // { thread_id: [已提取章节] }
  currentChapter: 0,
  targetChapters: 0,
  maxChapters: 0,
  filter: 'all',
  zoom: 100,          // 横向缩放（章节宽度）
  zoomY: 100,         // 纵向缩放（泳道 / 事件块高度）
  selectedIdx: null,
  activeTab: 'causal',
  highlightThread: null,
  rangeFrom: 1,       // 章节范围起点
  rangeTo: 999,       // 章节范围终点

let BOOKS_CACHE = [];
let _suppressClick = false;   // 拖动平移结束后抑制一次 click
const FILTER_LABEL = {all:'全部', position:'位置', emotion:'情感', info:'信息', conflict:'冲突', key:'关键节点'};

// ═══════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════
async function init() {
  const sel = document.getElementById('bk-sel');
  try {
    const resp = await fetch('/api/books');
    const books = await resp.json();
    BOOKS_CACHE = Array.isArray(books) ? books : [];
  } catch(e) { /* 没有后端，用演示数据 */ }

  const opts = BOOKS_CACHE.map(b =>
    `<option value="${escAttr(b.id)}">${escHtml(b.title || b.id)} · ${b.current_chapter || 0}章</option>`
  ).join('');
  sel.innerHTML = `<option value="">-- 选择书籍 --</option>${opts}<option value="demo">◈ 吞天魔帝（演示数据）</option>`;

  // 上次打开的书 > 第一本真实书籍 > 演示数据
  const saved = localStorage.getItem('tl_book') || '';
  const hasSaved = saved && Array.from(sel.options).some(o => o.value === saved);
  const prefer = hasSaved ? saved : (BOOKS_CACHE.length ? BOOKS_CACHE[0].id : 'demo');
  sel.value = prefer;

  bindEvents();
  await loadBook(prefer);

  // 缩放不再从本地恢复：避免上次缩到极小后每次打开都“看不见内容”
  const f = localStorage.getItem('tl_filter') || 'all';
  const chip = document.querySelector(`.chip[data-f="${f}"]`) || document.querySelector('.chip[data-f="all"]');
  if (chip) setFilter(f, chip);

  // 恢复上次的章节范围（超出范围时由 commitRange 自动收敛）
  const savedRange = localStorage.getItem('tl_range');
  if (savedRange) {
    const [a, b] = savedRange.split('-').map(n => parseInt(n, 10));
    if (a > 0 && b > 0) commitRange(a, b, false);
  }
}

function bindEvents() {
  // 事件委托：避免把 ID/文本拼进 onclick 带来的转义与注入问题
  document.getElementById('thread-list').addEventListener('click', e => {
    const item = e.target.closest('.thread-item');
    if (item && item.dataset.tid) highlightThread(item.dataset.tid);
  });

  const outer = document.getElementById('swimlane-outer');

  outer.addEventListener('click', e => {
    if (_suppressClick) { _suppressClick = false; return; }  // 刚拖动过，不当作点击
    const evEl = e.target.closest('.ev');
    if (evEl) { showDetail(parseInt(evEl.dataset.idx, 10)); return; }
    const lbl = e.target.closest('.lane-label');
    if (lbl && lbl.dataset.tid) highlightThread(lbl.dataset.tid);
  });

  // ── 滚轮 ──
  // 普通滚轮 = 正常滚动（不劫持，避免误缩放导致内容“消失”）
  // Ctrl/Cmd + 滚轮 = 横纵等比缩放（以光标为锚点）；Alt + 滚轮 = 仅纵向缩放
  outer.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey || e.altKey)) return;   // 交给浏览器原生滚动
    e.preventDefault();
    const dy = Math.max(-200, Math.min(200, e.deltaY || 0));
    if (!dy) return;
    const factor = Math.pow(1.0014, -dy);      // 向上滚放大，向下滚缩小（约 15%/格）
    if (e.altKey && !e.ctrlKey && !e.metaKey) zoomAtCursor(factor, e.clientX, e.clientY, 'y');
    else zoomAtCursor(factor, e.clientX, e.clientY, 'both');
  }, { passive: false });

  // ── 左键拖动平移 ──
  let pan = null;
  outer.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    // 排除滚动条区域与表单控件
    if (e.offsetX >= outer.clientWidth || e.offsetY >= outer.clientHeight) return;
    if (e.target.closest('input,button,select,a')) return;
    pan = { x: e.clientX, y: e.clientY, left: outer.scrollLeft, top: outer.scrollTop, moved: false };
    outer.classList.add('panning');
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!pan) return;
    const dx = e.clientX - pan.x;
    const dy = e.clientY - pan.y;
    if (!pan.moved && Math.abs(dx) + Math.abs(dy) > 3) pan.moved = true;
    if (!pan.moved) return;
    outer.scrollLeft = pan.left - dx;
    outer.scrollTop = pan.top - dy;
  });

  window.addEventListener('mouseup', () => {
    if (!pan) return;
    const moved = pan.moved;
    pan = null;
    outer.classList.remove('panning');
    if (moved) {
      _suppressClick = true;
      setTimeout(() => { _suppressClick = false; }, 0);
    }
  });
}

// 当前每章像素宽（与 renderSwimlane 使用同一套公式）
// 长书（章节多）默认压得更窄，先看到整体节奏，再 Ctrl+滚轮放大细看
function chapterBaseWidth(span) {
  return Math.max(12, Math.min(110, Math.round(920 / span)));
}

function chapterWidth() {
  const from = state.rangeFrom || 1;
  const to = Math.max(from, state.rangeTo || getMaxChapter());
  const span = Math.max(1, to - from + 1);
  return Math.max(6, Math.round(chapterBaseWidth(span) * (state.zoom / 100)));
}

// 以光标位置为锚点缩放，保证鼠标下的内容不跑偏
function zoomAtCursor(factor, clientX, clientY, mode) {
  const outer = document.getElementById('swimlane-outer');
  const rect = outer.getBoundingClientRect();
  const LABEL_W = 176;
  const px = clientX - rect.left;
  const py = clientY - rect.top;

  const beforeChW = chapterWidth() || 1;
  const beforeLeft = outer.scrollLeft;
  const beforeTop = outer.scrollTop;
  const beforeSH = Math.max(1, outer.scrollHeight);

  // 先按横纵上限收敛倍数，避免一个轴到顶后画面被拉变形
  let f = factor;
  if (mode !== 'y') {
    f = Math.min(f, 300 / state.zoom);
    f = Math.max(f, 40 / state.zoom);
  }
  if (mode !== 'x') {
    f = Math.min(f, 220 / state.zoomY);
    f = Math.max(f, 50 / state.zoomY);
  }

  const nx = mode === 'y' ? state.zoom : clampZZoomX(state.zoom * f);
  const ny = mode === 'x' ? state.zoomY : clampZZoomY(state.zoomY * f);
  if (nx === state.zoom && ny === state.zoomY) return;

  setZoom(nx, true);
  setZoomY(ny, true);
  renderSwimlane();

  // 恢复锚点：光标下的章节与纵向比例保持不动
  const newChW = chapterWidth() || 1;
  const chFrac = (beforeLeft + px - LABEL_W) / beforeChW;
  outer.scrollLeft = Math.max(0, LABEL_W + chFrac * newChW - px);
  const ratioY = (beforeTop + py) / beforeSH;
  outer.scrollTop = Math.max(0, ratioY * Math.max(1, outer.scrollHeight) - py);
}

// ═══════════════════════════════════════════════════════
// 加载书籍
// ═══════════════════════════════════════════════════════
async function loadBook(bookId) {
  if (!bookId) {
    resetView(); return;
  }
  state.bookId = bookId;
  localStorage.setItem('tl_book', bookId);

  const outer = document.getElementById('swimlane-outer');
  outer.innerHTML = `<div style="padding:18px 20px 18px 180px">${'<div class="skeleton"></div>'.repeat(5)}</div>`;

  if (bookId === 'demo') {
    // 演示模式：直接用内嵌数据
    state.demo = true;
    state.bookTitle = DEMO.book.title;
    applyData(DEMO.threads, DEMO.timeline, DEMO.causal_links, DEMO.dormant,
              DEMO.book.current_chapter, DEMO.book.target_chapters, {});
    populateChapterSelect(DEMO.book.current_chapter);
    return;
  }

  state.demo = false;
  try {
    const [statusResp, tlResp] = await Promise.all([
      fetch(`/api/books/${encodeURIComponent(bookId)}/threads/status`),
      fetch(`/api/books/${encodeURIComponent(bookId)}/timeline`),
    ]);
    if (!statusResp.ok) throw new Error(`状态接口返回 ${statusResp.status}`);
    const status = await statusResp.json();
    const timeline = await tlResp.json().catch(() => []);
    const book = BOOKS_CACHE.find(b => b.id === bookId);
    state.bookTitle = book?.title || bookId;
    applyData(
      status.threads || [],
      Array.isArray(timeline) ? timeline : [],
      status.cross_thread_causal_links || [],
      status.dormant || [],
      status.current_chapter || 0,
      book?.target_chapters || 0,
      status.thread_chapter_map || {},
    );
    populateChapterSelect(status.current_chapter || 0);
  } catch(e) {
    outer.innerHTML = `<div class="empty"><div class="empty-icon">!</div><div class="empty-title">加载失败</div><div class="empty-desc">${escHtml(e.message)}<br>请确认后端服务已启动（默认 8766 端口）。</div></div>`;
    setMeta();
  }
}

function applyData(threads, timeline, causal, dormant, currentChapter, targetChapters, chapterMap) {
  state.threads = threads || [];
  state.timelineFull = timeline || [];
  state.causal = Array.isArray(causal) ? causal : [];
  state.dormant = Array.isArray(dormant) ? dormant : [];
  state.threadChapterMap = chapterMap || {};
  state.currentChapter = currentChapter || 0;
  state.targetChapters = targetChapters || 0;
  state.highlightThread = null;
  state.selectedIdx = null;
  closeDetail();

  // 章节上限：当前进度 / 事件最远章节 / 线程最后活跃章节，三者取最大
  const maxCh = getMaxChapter();
  state.maxChapters = maxCh;
  state.rangeFrom = 1;
  state.rangeTo = maxCh;

  // 显示范围控件（章节 > 30 时才有意义）
  const showRange = maxCh > 30;
  document.getElementById('range-bar').style.display = showRange ? '' : 'none';
  document.getElementById('minimap-wrap').style.display = showRange ? '' : 'none';
  document.getElementById('range-from').max = maxCh;
  document.getElementById('range-to').max = maxCh;
  document.getElementById('range-from').value = 1;
  document.getElementById('range-to').value = maxCh;

  applyRangeFilter();
  renderThreadList();
  renderSwimlane();
  renderBottom();
  updateChipCounts();
  setMeta();
}

function getMaxChapter() {
  return Math.max(1,
    state.currentChapter || 0,
    ...state.timelineFull.map(e => e.chapter || 1),
    ...state.threads.map(t => t.last_active_chapter || 1));
}

function setMeta() {
  const el = document.getElementById('book-meta');
  if (!el) return;
  if (!state.bookId) {
    el.innerHTML = '<span class="dot" style="background:var(--text3);box-shadow:none"></span><span>未加载</span>';
    return;
  }
  document.title = `${state.bookTitle || state.bookId} · 多线叙事时间线 — Dramatica-Flow`;
  const cur = state.currentChapter || 0;
  const total = state.targetChapters ? `/${state.targetChapters}` : '';
  el.innerHTML = `<span class="dot"></span><b>${escHtml(state.bookTitle || state.bookId)}</b>`
    + `<span class="msep">·</span>${cur}${total} 章`
    + `<span class="msep">·</span>${state.threads.length} 线程`
    + `<span class="msep">·</span>${state.timelineFull.length} 事件`
    + (state.demo ? '<span class="msep">·</span>演示' : '');
}

function updateChipCounts() {
  const counts = {all: state.timelineFull.length};
  state.timelineFull.forEach(ev => {
    const k = catOf(ev);
    counts[k] = (counts[k] || 0) + 1;
  });
  document.querySelectorAll('#filter-chips .chip').forEach(chip => {
    const f = chip.dataset.f;
    chip.innerHTML = `${FILTER_LABEL[f] || f}<span class="chip-n">${counts[f] || 0}</span>`;
  });
}

function applyRangeFilter() {
  const from = state.rangeFrom || 1;
  const to = state.rangeTo || 9999;
  state.timeline = state.timelineFull.filter(e => {
    const ch = e.chapter || 1;
    return ch >= from && ch <= to;
  });
  const info = document.getElementById('range-info');
  if (info) info.textContent = `Ch ${from}–${to} · 范围内 ${state.timeline.length} / 共 ${state.timelineFull.length} 事件`;
}

function resetView() {
  state.bookId = ''; state.bookTitle = ''; state.demo = false;
  state.threads = []; state.timeline = []; state.timelineFull = [];
  state.causal = []; state.dormant = []; state.threadChapterMap = {};
  document.getElementById('thread-list').innerHTML = '<div class="detail-empty" style="padding:24px 16px">选择书籍后显示</div>';
  document.getElementById('thread-count').textContent = '0';
  document.getElementById('swimlane-outer').innerHTML = '<div class="empty" id="empty-state"><div class="empty-icon">〰</div><div class="empty-title">选择书籍开始</div><div class="empty-desc">从右上角下拉菜单选择书籍，即可查看多线叙事泳道图。</div></div>';
  document.getElementById('range-bar').style.display = 'none';
  document.getElementById('minimap-wrap').style.display = 'none';
  document.getElementById('ch-sel').innerHTML = '<option value="">提取章节</option>';
  setMeta();
  closeDetail();
}

// ═══════════════════════════════════════════════════════
// 渲染线程列表
// ═══════════════════════════════════════════════════════
function renderThreadList() {
  const el = document.getElementById('thread-list');
  document.getElementById('thread-count').textContent = state.threads.length;
  if (!state.threads.length) {
    el.innerHTML = '<div class="detail-empty" style="padding:20px 16px">暂无线程</div>'; return;
  }
  const typeLabel = {main:'主线', subplot:'支线', parallel:'并行', flashback:'闪回'};
  const statusLabel = {active:'活跃', dormant:'休眠', resolved:'完结', merged:'已合并'};

  el.innerHTML = state.threads.map(t => {
    const color = TYPE_COLORS[t.type] || TYPE_COLORS.default;
    const tc = 'tb-' + (t.type || 'subplot');
    const sc = 'tb-' + (t.status || 'active');
    const evs = state.timelineFull.filter(e => e.thread_id === t.id);
    const keyCount = evs.filter(e => e.is_key).length;
    const weight = Math.round((t.weight == null ? 0.5 : t.weight) * 100);
    const range = `Ch${t.start_chapter || 1}–${t.last_active_chapter || '—'}`;
    return `<div class="thread-item ${state.highlightThread === t.id ? 'active' : ''}" data-tid="${escAttr(t.id)}" title="${escHtml(t.goal || t.name || t.id)}">
      <div class="ti-name" style="justify-content:space-between">
        <span style="display:flex;align-items:center;gap:6px;min-width:0">
          <span class="thread-dot" style="background:${color}"></span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(t.name || t.id)}</span>
        </span>
        <span class="type-badge ${tc}" style="flex-shrink:0">${typeLabel[t.type] || t.type}</span>
      </div>
      <div class="ti-meta">
        <span class="type-badge ${sc}">${statusLabel[t.status] || t.status || '活跃'}</span>
        <span>${evs.length} 事件${keyCount ? ` · <span style="color:var(--orange)">${keyCount} 关键</span>` : ''}</span>
        <span class="ti-range">${range}</span>
      </div>
      <div class="ti-bar" title="篇幅权重 ${weight}%"><i style="width:${weight}%;background:${color}"></i></div>
    </div>`;
  }).join('');

  applyHighlight();
}

function highlightThread(tid) {
  state.highlightThread = (state.highlightThread === tid) ? null : tid;
  document.querySelectorAll('.thread-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tid === state.highlightThread);
  });
  applyHighlight();
  if (state.highlightThread) {
    const row = document.querySelector(`.lane-row[data-tid="${cssEsc(state.highlightThread)}"]`);
    if (row) row.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }
}

// 把 state.highlightThread 落到 DOM（重绘后调用，保证高亮不丢）
function applyHighlight() {
  const tid = state.highlightThread;
  document.querySelectorAll('.lane-row').forEach(el => {
    el.style.opacity = (!tid || el.dataset.tid === tid) ? '1' : '0.32';
  });
  document.querySelectorAll('.lane-track').forEach(el => {
    el.classList.toggle('highlight', !!tid && el.dataset.tid === tid);
  });
}

// ═══════════════════════════════════════════════════════
// 渲染泳道图
// ═══════════════════════════════════════════════════════
const TYPE_COLORS = {
  main:'var(--blue)', subplot:'var(--purple)', parallel:'var(--cyan)',
  flashback:'var(--orange)', default:'var(--text2)'
};
const TYPE_LABEL = {main:'主线', subplot:'支线', parallel:'并行', flashback:'闪回'};
const EV_CATS = {
  position:{cls:'ev-pos', color:'#1a6fd4'},
  emotion: {cls:'ev-emotion', color:'#b83c3c'},
  info:    {cls:'ev-info', color:'#1a7a32'},
  conflict:{cls:'ev-conflict', color:'#c06010'},
  key:     {cls:'ev-key', color:'#b04020'},
  other:   {cls:'ev-other', color:'#5a3aa0'},
};

// 优先使用后端给出的 type；缺失时按 action 关键词回退推断
function catOf(ev) {
  if (!ev) return 'other';
  if (ev.is_key) return 'key';
  const t = String(ev.type || '').toLowerCase();
  if (t === 'position' || t === 'emotion' || t === 'info' || t === 'conflict') return t;
  const a = String(ev.action || '').toLowerCase();
  if (t.includes('position')||a.includes('位置')||a.includes('移动')||a.includes('到达')||a.includes('离开')||a.includes('进入')||a.includes('前往')) return 'position';
  if (t.includes('emotion')||a.includes('情感')||a.includes('情绪')||a.includes('动摇')||a.includes('坚定')||a.includes('愤怒')||a.includes('屈辱')||a.includes('震怒')) return 'emotion';
  if (t.includes('info')||a.includes('发现')||a.includes('揭示')||a.includes('得知')||a.includes('真相')||a.includes('秘密')) return 'info';
  if (t.includes('conflict')||a.includes('冲突')||a.includes('对决')||a.includes('暗算')||a.includes('设局')||a.includes('施压')||a.includes('反制')) return 'conflict';
  return 'other';
}

function renderSwimlane() {
  const outer = document.getElementById('swimlane-outer');
  if (!state.threads.length && !state.timeline.length) {
    outer.innerHTML = '<div class="empty"><div class="empty-icon">〰</div><div class="empty-title">暂无数据</div><div class="empty-desc">添加叙事线程后，时间轴事件会出现在泳道图中。</div></div>';
    return;
  }

  const from = state.rangeFrom || 1;
  const to = Math.max(from, state.rangeTo || getMaxChapter());
  const span = Math.max(1, to - from + 1);
  const zoomY = (state.zoomY || 100) / 100;
  const LABEL_W = 176;

  // 纵向尺寸（跟随纵向缩放）
  const baseLaneH = Math.max(20, Math.round(34 * zoomY));
  const rowStep   = Math.max(9,  Math.round(15 * zoomY));
  const rowGap    = Math.max(4,  Math.round(8 * zoomY));
  const evH0      = Math.max(12, Math.round(28 * zoomY));
  const evH1      = Math.max(8,  Math.round(12 * zoomY));
  const evFont0   = Math.max(8, Math.min(13, Math.round(10 * (0.85 + zoomY * 0.15))));
  const laneFont  = Math.max(11, Math.min(17, Math.round(12 * (0.85 + zoomY * 0.15))));

  // 每章像素宽：范围小自动放大，范围大自动压缩（与 chapterWidth() 同一公式）
  const chW = chapterWidth();
  const totalW = chW * span;

  // 事件 → 全局索引（避免每次 indexOf 造成 O(n²)）
  const idxMap = new Map();
  state.timelineFull.forEach((ev, i) => idxMap.set(ev, i));

  const evByThread = {};
  state.timeline.forEach(ev => {
    const tid = ev.thread_id || '__other__';
    (evByThread[tid] = evByThread[tid] || []).push(ev);
  });

  const act1 = Math.max(1, Math.round(span * 0.25));
  const act2 = Math.max(act1 + 1, Math.round(span * 0.75));

  let html = `<div class="swimlane-inner" style="width:${totalW + LABEL_W + 40}px">`;

  // ── 章节标尺 + 三幕 ──
  html += `<div class="ruler-row">`;
  html += `<div class="ruler-label-cell"></div>`;
  html += `<div class="ruler-track" style="width:${totalW}px;flex:none;position:relative;height:42px">`;
  html += `<div class="act-bg" style="left:${act1*chW}px;width:${(act2-act1)*chW}px;background:rgba(88,166,255,.035)"></div>`;
  html += `<div class="act-bg" style="left:${act2*chW}px;width:${(span-act2)*chW}px;background:rgba(188,140,255,.035);border-right:none"></div>`;
  html += `<span class="act-label" style="left:${act1*chW/2}px">第一幕</span>`;
  html += `<span class="act-label" style="left:${(act1+act2)*chW/2}px">第二幕</span>`;
  html += `<span class="act-label" style="left:${(act2+span)*chW/2}px">第三幕</span>`;
  const step = span <= 20 ? 1 : span <= 50 ? 5 : span <= 120 ? 10 : 20;
  for (let i = 0; i < span; i += step) {
    html += `<div class="ruler-mark" style="left:${i*chW + chW/2}px">Ch${from+i}</div>`;
  }
  html += `</div></div>`;

  // ── 泳道行 ──
  const knownIds = state.threads.map(t => t.id);
  const laneIds = [...knownIds,
    ...Object.keys(evByThread).filter(k => k !== '__other__' && !knownIds.includes(k))];
  if (evByThread['__other__']) laneIds.push('__other__');

  laneIds.forEach(tid => {
    const thread = state.threads.find(t => t.id === tid)
      || (tid === '__other__'
          ? { id: '__other__', name: '未归属事件', type: 'other', weight: 0 }
          : { id: tid, name: tid, type: 'other', weight: 0 });
    const color = TYPE_COLORS[thread.type] || TYPE_COLORS.default;
    // 筛选时保留全部事件、只淡化非匹配项，避免丢失上下文
    const events = evByThread[tid] || [];

    // 同章堆叠数量决定泳道高度
    const chCount = {};
    events.forEach(ev => { const ch = ev.chapter || 1; chCount[ch] = (chCount[ch] || 0) + 1; });
    const maxStack = Math.max(1, ...Object.values(chCount));
    const laneH = baseLaneH + (maxStack - 1) * rowStep;

    const meta = tid === '__other__'
      ? `${events.length} 事件 · 未分配线程`
      : `${TYPE_LABEL[thread.type] || thread.type} · 权重 ${Math.round((thread.weight == null ? 0.5 : thread.weight) * 100)}% · Ch${thread.start_chapter || 1}–${thread.last_active_chapter || '—'}`;

    html += `<div class="lane-row" data-tid="${escAttr(tid)}" style="margin-bottom:${rowGap}px">`;
    html += `<div class="lane-label" data-tid="${escAttr(tid)}" style="min-height:${laneH}px" title="${escHtml(thread.goal || thread.name || tid)}">`
         +  `<div class="ll-name" style="color:${color};font-size:${laneFont}px">${escHtml(thread.name || tid)}</div>`
         +  `<div class="ll-meta">${escHtml(meta)}</div>`
         +  `</div>`;
    html += `<div class="lane-track" data-tid="${escAttr(tid)}" style="width:${totalW}px;flex:none;position:relative;height:${laneH}px;background-image:linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:${chW}px 100%">`;

    // 线程活跃区间底色
    if (tid !== '__other__') {
      const ts = Math.max(from, thread.start_chapter || from);
      const te = Math.min(to, thread.last_active_chapter || to);
      if (ts <= te) {
        html += `<div style="position:absolute;left:${(ts-from)*chW}px;width:${(te-ts+1)*chW}px;top:1px;bottom:1px;background:${color};opacity:.05;border-radius:3px;pointer-events:none"></div>`;
      }
    }

    // 当前章节标线
    if (state.currentChapter >= from && state.currentChapter <= to) {
      html += `<div class="lane-now" style="left:${(state.currentChapter-from)*chW + chW/2}px" title="当前 Ch${state.currentChapter}"></div>`;
    }

    // 三幕分界
    [act1, act2].forEach(a => {
      html += `<div style="position:absolute;left:${a*chW}px;top:0;bottom:0;width:1px;background:var(--border);opacity:.45;pointer-events:none"></div>`;
    });

    // 事件方块（同章纵向错开）
    const stack = {};
    events.forEach(ev => {
      const ch = ev.chapter || 1;
      const row = stack[ch] || 0;
      stack[ch] = row + 1;
      const cat = catOf(ev);
      const cls = (EV_CATS[cat] || EV_CATS.other).cls;
      const idx = idxMap.get(ev);
      // 空间够就显示事件摘要（2 字起），不够只留 ★ 标记，避免整片色块完全看不出内容
      const maxChars = Math.max(2, Math.floor((chW - 6) / 9));
      const label = chW >= 28 ? String(ev.action || '').slice(0, maxChars) : (ev.is_key ? '\u2605' : '');
      const dimmed = state.filter !== 'all' && cat !== state.filter;
      html += `<div class="ev ${cls}${dimmed ? ' dimmed' : ''}" data-idx="${idx}"
        style="left:${(ch-from)*chW + 1}px;width:${Math.max(chW - 3, 4)}px;min-width:${Math.max(4, chW - 4)}px;top:${3 + row*rowStep}px;height:${row === 0 ? Math.min(evH0, laneH - 6) : evH1}px;font-size:${row === 0 ? evFont0 : Math.max(7, evFont0 - 2)}px"
        title="Ch${ch} · ${escHtml(ev.action || '')}${ev.is_key ? ' ★' : ''}">${escHtml(label)}</div>`;
    });

    html += `</div></div>`;
  });

  html += `</div>`;
  outer.innerHTML = html;
  applyHighlight();

  // 重绘后恢复详情选中态
  if (state.selectedIdx != null) {
    const selEl = outer.querySelector(`.ev[data-idx="${state.selectedIdx}"]`);
    if (selEl) selEl.classList.add('sel');
  }

  renderMinimap();
}

// ═══════════════════════════════════════════════════════
// 事件详情
// ═══════════════════════════════════════════════════════
function showDetail(idx) {
  if (!(idx >= 0) || idx >= state.timelineFull.length) return;
  state.selectedIdx = idx;
  const ev = state.timelineFull[idx];
  const cat = catOf(ev);
  const catNames = {position:'位置变化', emotion:'情感转变', info:'信息揭示', conflict:'核心冲突', key:'关键节点', other:'其他事件'};
  const thread = state.threads.find(t => t.id === ev.thread_id);
  const tColor = thread ? (TYPE_COLORS[thread.type] || TYPE_COLORS.default) : 'var(--text2)';

  document.querySelectorAll('.ev').forEach(el => el.classList.toggle('sel', +el.dataset.idx === idx));

  let html = '';
  // 概览卡
  html += `<div class="dt-card">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap">
      <span class="dt-tag" style="background:${cat === 'key' ? 'var(--orange-bg)' : 'var(--surface3)'};color:${cat === 'key' ? 'var(--orange)' : 'var(--text2)'}">${catNames[cat] || cat}</span>
      ${ev.is_key ? '<span class="dt-tag" style="background:rgba(240,136,62,.16);color:var(--orange)">★ 关键</span>' : ''}
      <span style="margin-left:auto;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums">Ch ${ev.chapter || '?'}</span>
    </div>
    <div style="font-size:13px;line-height:1.7;color:var(--text)">${escHtml(ev.action || '（无事件描述）')}</div>
  </div>`;

  // 归属卡
  html += `<div class="dt-card">
    <div class="dt-kv"><span style="min-width:34px">线程</span><b style="color:${tColor}">${escHtml(thread ? thread.name : (ev.thread_id || '未归属'))}</b></div>
    <div class="dt-kv"><span style="min-width:34px">角色</span><b>${escHtml(ev.character_id || '—')}</b></div>
    <div class="dt-kv"><span style="min-width:34px">地点</span><b>${escHtml(ev.location_id || '—')}</b></div>
    ${ev.physical_time ? `<div class="dt-kv"><span style="min-width:34px">时间</span><b>${escHtml(ev.physical_time)}</b></div>` : ''}
  </div>`;

  // 关联因果链
  const linked = state.causal.filter(c => causalTouches(c, ev));
  html += `<div class="df-label" style="margin-bottom:5px">关联因果链</div>`;
  if (linked.length) {
    linked.forEach(c => {
      const src = state.threads.find(t => t.id === c.source_thread_id);
      const tgt = state.threads.find(t => t.id === c.target_thread_id);
      const chTxt = causalChapterText(c);
      html += `<div class="dt-chain">
        <span style="color:var(--blue);font-weight:600">${escHtml(src ? src.name : (c.source_thread_id || '?'))}</span>
        <span style="color:var(--text3)"> → </span>
        <span style="color:var(--purple);font-weight:600">${escHtml(tgt ? tgt.name : (c.target_thread_id || '?'))}</span>
        ${chTxt ? `<span class="causal-ch" style="margin-left:6px">${chTxt}</span>` : ''}
        <div style="color:var(--text2);margin-top:3px">${escHtml(c.description || c.cause || c.consequence || '—')}</div>
      </div>`;
    });
  } else {
    html += `<div style="font-size:11px;color:var(--text3);padding:9px 11px;background:var(--surface);border-radius:6px">此事件暂未检测到跨线程因果影响。</div>`;
  }

  document.getElementById('detail-body').innerHTML = html;
  document.getElementById('detail-close-btn').style.display = '';
  document.getElementById('detail-ft').style.display = '';
}

// 因果链是否与该事件相关（后端不一定提供 source_chapter，缺省时按线程匹配）
function causalTouches(c, ev) {
  if (!c || !ev) return false;
  if (c.target_thread_id === ev.thread_id) {
    if (c.target_chapter == null || c.target_chapter === ev.chapter) return true;
  }
  if (c.source_thread_id === ev.thread_id) {
    if (c.source_chapter == null || c.source_chapter === ev.chapter) return true;
  }
  return false;
}

function causalChapterText(c) {
  const s = c.source_chapter, t = c.target_chapter;
  if (s != null && t != null) return `Ch${s} → Ch${t}`;
  if (t != null) return `Ch${t}`;
  if (s != null) return `Ch${s}`;
  return '';
}

function closeDetail() {
  state.selectedIdx = null;
  document.querySelectorAll('.ev').forEach(el => el.classList.remove('sel'));
  document.getElementById('detail-body').innerHTML = '<div class="detail-empty">点击泳道中的<br>事件方块查看详情</div>';
  document.getElementById('detail-close-btn').style.display = 'none';
  document.getElementById('detail-ft').style.display = 'none';
}

function renderBottom() {
  const causalBadge = document.getElementById('causal-badge');
  const warnBadge   = document.getElementById('warning-badge');
  if (state.causal.length) { causalBadge.style.display=''; causalBadge.textContent=state.causal.length; }
  else causalBadge.style.display='none';
  if (state.dormant.length) { warnBadge.style.display=''; warnBadge.textContent=state.dormant.length; }
  else warnBadge.style.display='none';
  if (state.activeTab === 'causal') renderCausal();
  else renderWarnings();
}

function renderCausal() {
  const el = document.getElementById('bottom-body');
  if (!state.causal.length) {
    el.innerHTML = '<div class="detail-empty" style="padding:20px">暂无跨线程因果链数据<br><span style="font-size:11px">提取章节后会自动生成跨线因果</span></div>';
    return;
  }
  el.innerHTML = state.causal.map(c => {
    const srcT = state.threads.find(t => t.id === c.source_thread_id);
    const tgtT = state.threads.find(t => t.id === c.target_thread_id);
    const chTxt = causalChapterText(c);
    return `<div class="causal-row">
      <div class="causal-dot" style="background:var(--blue)"></div>
      <span style="color:var(--blue);font-weight:600;min-width:62px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(srcT ? srcT.name : (c.source_thread_id || '?'))}</span>
      <span style="color:var(--text3);font-size:12px">→</span>
      <span style="color:var(--purple);font-weight:600;min-width:62px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(tgtT ? tgtT.name : (c.target_thread_id || '?'))}</span>
      <span style="flex:1;min-width:160px;color:var(--text2)">${escHtml(c.description || c.cause || c.consequence || '—')}</span>
      ${chTxt ? `<span class="causal-ch">${chTxt}</span>` : ''}
    </div>`;
  }).join('');
}

function renderWarnings() {
  const el = document.getElementById('bottom-body');
  const cur = state.currentChapter || 0;
  const dormant = (state.dormant && state.dormant.length)
    ? state.dormant
    : state.threads.filter(t => t.status === 'dormant')
        .map(t => ({...t, gap: Math.max(0, cur - (t.last_active_chapter || 0))}));
  if (!dormant.length) {
    el.innerHTML = '<div class="detail-empty" style="padding:20px">✓ 所有线程均活跃，无掉线预警</div>';
    return;
  }
  el.innerHTML = dormant.map(t => {
    const gap = (t.gap == null) ? Math.max(0, cur - (t.last_active_chapter || 0)) : t.gap;
    return `<div class="warn-row">
      <div class="warn-badge">休眠</div>
      <div style="flex:1">
        <strong>${escHtml(t.name || t.id)}</strong>
        <span style="color:var(--text3)"> — 已 </span>
        <span style="color:var(--yellow);font-weight:700">${gap} 章</span>
        <span style="color:var(--text3)"> 未出现（最后活跃 Ch${t.last_active_chapter || '?'}）</span>
      </div>
      <button class="btn btn-sm" data-wake="${escAttr(t.id)}" onclick="wakeThread(this.dataset.wake)">唤醒</button>
    </div>`;
  }).join('');
}

function switchTab(tab) {
  state.activeTab = tab;
  document.getElementById('btab-causal').classList.toggle('on', tab==='causal');
  document.getElementById('btab-warning').classList.toggle('on', tab==='warning');

}

function clampZZoomX(v) {
  return Math.max(40, Math.min(300, Math.round(parseInt(v, 10) || 100)));
}

function clampZZoomY(v) {
  return Math.max(50, Math.min(220, Math.round(parseInt(v, 10) || 100)));
}

// 横向缩放：影响每章像素宽
function setZoom(val, silent) {
  state.zoom = clampZZoomX(val);
  document.getElementById('zoom-input').value = state.zoom;
  if (!silent) renderSwimlane();
}

// 纵向缩放：影响泳道高度、事件块高度、行间距
function setZoomY(val, silent) {
  state.zoomY = clampZZoomY(val);
  const el = document.getElementById('zoomy-input');
  if (el) el.value = state.zoomY;
  if (!silent) renderSwimlane();
}

function resetZoom() {
  setZoom(100, true);
  setZoomY(100, true);
  renderSwimlane();
  const outer = document.getElementById('swimlane-outer');
  if (outer) { outer.scrollLeft = 0; outer.scrollTop = 0; }
}

// 适应窗口：算出刚好铺满可视宽度的横向缩放，纵向恢复 100%
function fitToWindow() {
  const outer = document.getElementById('swimlane-outer');
  if (!outer || !outer.clientWidth) return;
  const from = state.rangeFrom || 1;
  const to = Math.max(from, state.rangeTo || getMaxChapter());
  const span = Math.max(1, to - from + 1);
  const avail = Math.max(240, outer.clientWidth - 176 - 28);
  const base = chapterBaseWidth(span);
  let z = Math.round((avail / span) / base * 100);
  z = clampZZoomX(z);
  setZoom(z, true);
  setZoomY(100, true);
  renderSwimlane();
  outer.scrollLeft = 0;
  outer.scrollTop = 0;
}

function closeModal() { document.getElementById('thread-modal').style.display='none'; }

async function saveThread() {
  const id=document.getElementById('tf-id').value.trim();
  const name=document.getElementById('tf-name').value.trim();
  if(!id||!name){alert('ID 和名称为必填项');return;}
  const body={id,name,type:document.getElementById('tf-type').value,weight:parseFloat(document.getElementById('tf-weight').value)||0.7,
    pov_character_id:document.getElementById('tf-pov').value.trim(),
    character_ids:document.getElementById('tf-chars').value.split(',').map(s=>s.trim()).filter(Boolean),
    goal:document.getElementById('tf-goal').value.trim(),growth_arc:document.getElementById('tf-arc').value.trim(),

    merge_chapter:parseInt(document.getElementById('tf-merge').value)||null,
    end_hook:document.getElementById('tf-hook').value.trim()};

  if (state.bookId === 'demo') {
    // 演示模式：直接添加到本地
    state.threads.push({...body, status:'active', last_active_chapter:0});
    closeModal();
    renderThreadList(); renderSwimlane(); return;
  }

  try {
    const resp=await fetch(`/api/books/${state.bookId}/threads`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await resp.json();
    if(!data.ok){alert(data.detail||'创建失败');return;}
    closeModal(); loadBook(state.bookId);
  } catch(e){alert('保存失败：'+e.message);}
}

async function wakeThread(tid) {
  if (state.bookId==='demo') {
    const t=state.threads.find(t=>t.id===tid); if(t) t.status='active';
    state.dormant=state.dormant.filter(d=>d.id!==tid);
    renderBottom(); renderThreadList(); return;
  }
  await fetch(`/api/books/${state.bookId}/threads/${tid}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'active'})});
  loadBook(state.bookId);
}

// 章节选择 + 提取数据
// ═══════════════════════════════════════════════════════
function populateChapterSelect(maxCh) {
  const sel = document.getElementById('ch-sel');
  const extracted = new Set();
  Object.values(state.threadChapterMap || {}).forEach(list => (list || []).forEach(c => extracted.add(c)));

  sel.innerHTML = '<option value="">提取章节</option>';
  for (let i = 1; i <= maxCh; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `第${i}章${extracted.has(i) ? ' ✓' : ''}`;
    sel.appendChild(opt);
  }
  if (maxCh > 0) sel.value = maxCh;
  sel.title = extracted.size
    ? `已提取 ${extracted.size} 章（带 ✓ 标记，重复提取会覆盖该章旧事件）`
    : '选择要提取时间线数据的章节';
}

async function extractData(btn) {
  const ch = parseInt(document.getElementById('ch-sel').value, 10);
  if (!ch) { alert('请先在右上角选择章节'); return; }
  if (state.bookId === 'demo') { alert('演示模式使用内嵌数据，无需提取。\n选择一本真实书籍后即可提取。'); return; }
  if (!confirm(`将从第 ${ch} 章正文提取时间线数据，约需 30 秒，继续？`)) return;

  if (btn) { btn.disabled = true; btn.textContent = '提取中…'; }
  try {
    const resp = await fetch(`/api/books/${encodeURIComponent(state.bookId)}/extract-story-state`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chapter: ch}),
    });
    const data = await resp.json();
    if (data.ok) {
      alert(`提取成功！\n${data.summary || ''}\n（已自动识别章节主要角色并分配到对应线程）`);
      await loadBook(state.bookId);
    } else {
      alert('提取失败：' + (data.error || data.detail || '未知错误'));
    }
  } catch(e) {
    alert('请求失败：' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⚡ 提取'; }
  }
}

// ═══════════════════════════════════════════════════════
function commitRange(from, to, withThreadList = true) {
  const maxCh = getMaxChapter();
  from = Math.max(1, Math.min(parseInt(from, 10) || 1, maxCh));
  to = Math.max(from, Math.min(parseInt(to, 10) || maxCh, maxCh));
  state.rangeFrom = from;
  state.rangeTo = to;

  const fromEl = document.getElementById('range-from');
  const toEl = document.getElementById('range-to');
  if (fromEl) { fromEl.max = maxCh; fromEl.value = from; }
  if (toEl) { toEl.max = maxCh; toEl.value = to; }

  localStorage.setItem('tl_range', `${from}-${to}`);
  applyRangeFilter();
  renderSwimlane();
  if (withThreadList) renderThreadList();
}

function setRange() {
  commitRange(document.getElementById('range-from').value, document.getElementById('range-to').value);
}

function setRangeAll() {
  commitRange(1, getMaxChapter());
}

function setRangeAround() {
  const ch = state.currentChapter || getMaxChapter();
  commitRange(Math.max(1, ch - 30), ch + 30);
}

// ═══════════════════════════════════════════════════════
// 迷你总览热力条
// ═══════════════════════════════════════════════════════
function renderMinimap() {
  const mm = document.getElementById('minimap');
  const vp = document.getElementById('minimap-vp');
  const now = document.getElementById('minimap-now');
  if (!mm || !vp || !now) return;

  const maxCh = getMaxChapter();
  const mmW = mm.clientWidth || 600;

  // 清除旧的热力点（保留 viewport 和 now）
  mm.querySelectorAll('.minimap-dot').forEach(d => d.remove());

  // 按章节统计事件密度
  const density = {};
  state.timelineFull.forEach(ev => {
    const ch = ev.chapter || 1;
    density[ch] = (density[ch] || 0) + 1;
  });
  const maxDensity = Math.max(1, ...Object.values(density));
  const keyChapters = new Set(state.timelineFull.filter(e => e.is_key).map(e => e.chapter || 1));

  Object.entries(density).forEach(([ch, count]) => {
    const c = parseInt(ch, 10);
    const isKey = keyChapters.has(c);
    const dot = document.createElement('div');
    dot.className = 'minimap-dot' + (isKey ? ' key-dot' : '');
    dot.style.left = Math.min(mmW - 3, ((c - 1) / maxCh) * mmW) + 'px';
    dot.style.background = isKey ? 'var(--orange)' : 'var(--blue)';
    dot.style.opacity = (0.25 + 0.75 * (count / maxDensity)).toFixed(2);
    mm.appendChild(dot);
  });

  // 视口选择框（限制在轨道内，避免溢出）
  const from = Math.max(1, state.rangeFrom || 1);
  const to = Math.min(maxCh, state.rangeTo || maxCh);
  const vpLeft = ((from - 1) / maxCh) * mmW;
  const vpWidth = ((to - from + 1) / maxCh) * mmW;
  vp.style.left = Math.min(vpLeft, Math.max(0, mmW - 8)) + 'px';
  vp.style.width = Math.max(8, Math.min(vpWidth, mmW)) + 'px';
  vp.style.display = (from === 1 && to === maxCh) ? 'none' : '';

  // 当前章节线
  if (state.currentChapter > 0) {
    now.style.left = Math.min(mmW - 1, ((state.currentChapter - 1) / maxCh) * mmW) + 'px';
    now.style.display = '';
  } else {
    now.style.display = 'none';
  }
}

let _mmDragging = false;
let _mmRaf = 0;
let _mmLastEvent = null;

function minimapDrag(e) {
  if (e.type === 'mousedown') {
    _mmDragging = true;
    scheduleMinimapDrag(e);
    const onMove = ev => { if (_mmDragging) scheduleMinimapDrag(ev); };
    const onUp = () => {
      _mmDragging = false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      renderThreadList();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  } else if (_mmDragging) {
    scheduleMinimapDrag(e);
  }
}

// 拖动时按帧合并重绘，避免每次 mousemove 都重建整张泳道图
function scheduleMinimapDrag(e) {
  _mmLastEvent = e;
  if (_mmRaf) return;
  _mmRaf = requestAnimationFrame(() => {
    _mmRaf = 0;
    if (_mmLastEvent) applyMinimapDrag(_mmLastEvent);
  });
}

function applyMinimapDrag(e) {
  const mm = document.getElementById('minimap');
  if (!mm) return;
  const maxCh = getMaxChapter();
  const mmW = mm.clientWidth || 600;
  const span = Math.max(1, (state.rangeTo || maxCh) - (state.rangeFrom || 1) + 1);
  const rect = mm.getBoundingClientRect();
  const x = Math.max(0, Math.min(e.clientX - rect.left, mmW));
  const ch = Math.round((x / mmW) * maxCh) + 1;

  let from = Math.max(1, ch - Math.floor(span / 2));
  let to = from + span - 1;
  if (to > maxCh) { to = maxCh; from = Math.max(1, to - span + 1); }

  state.rangeFrom = from;
  state.rangeTo = to;
  const fromEl = document.getElementById('range-from');
  const toEl = document.getElementById('range-to');
  if (fromEl) fromEl.value = from;
  if (toEl) toEl.value = to;
  applyRangeFilter();
  renderSwimlane();   // 内部会刷新 minimap
}

// ═══════════════════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════════════════
function escHtml(s = '') {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s = '') {
  return escHtml(s).replace(/'/g, '&#39;');
}

function cssEsc(s = '') {
  const str = String(s == null ? '' : s);
  if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(str);
  return str.replace(/["\\]/g, '\\$&');
}

// ═══════════════════════════════════════════════════════
// 启动
// ═══════════════════════════════════════════════════════
init().catch(err => {
  console.error(err);
  const outer = document.getElementById('swimlane-outer');
  if (outer) outer.innerHTML = `<div class="empty"><div class="empty-icon">!</div><div class="empty-title">初始化失败</div><div class="empty-desc">${escHtml(err && err.message)}</div></div>`;
});
